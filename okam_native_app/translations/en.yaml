configuration:
  account_username:
    name: O-KAM account email
    description: Email address of an O-KAM account that can view the selected cameras.
  account_password:
    name: O-KAM account password
    description: Password for the O-KAM account.
  api_token:
    name: Local API token
    description: A random secret of at least 16 characters that you create and also enter in the Home Assistant integration.
  cameras:
    name: Cameras
    description: Optional list of camera mappings. Leave empty to expose every account camera; each mapping requires a UID and may include an alias and an optional password.
    fields:
      uid:
        name: Camera UID
      alias:
        name: Alias
      auth_method:
        name: Authentication method
        options:
          automatic: Automatic
          password: Password
      password:
        name: Camera password
      battery_camera:
        name: Battery camera (sleep mode)
        description: Enable for battery-powered cameras that normally sleep. RTSP stays available in standby mode and switches to live video when the camera wakes.
      ip:
        name: Camera IP address
        description: Local IPv4 address used to detect wake events for battery cameras. Not required for normal cameras.
  api_port:
    name: API port
    description: Local HTTP API port. The default is 8099.
  rtsp_port:
    name: RTSP port
    description: Local RTSP-over-TCP streaming port. The default is 8100.
  idle_timeout_seconds:
    name: Idle disconnect delay
    description: Seconds to wait after the final viewer closes before stopping and disconnecting the camera.
  run_connect_test:
    name: Run connection diagnostic
    description: Perform a bounded P2P connection test when the app starts. Leave disabled for normal use.
  run_auth_test:
    name: Run authentication diagnostic
    description: Perform a bounded camera-login test when the app starts. Leave disabled for normal use.
  run_stream_test:
    name: Run H.264 diagnostic
    description: Receive a bounded native H.264 sample when the app starts. Leave disabled for normal use.
  run_snapshot_test:
    name: Run complete snapshot diagnostic
    description: Wake, connect, authenticate, receive H.264, create one JPEG, and disconnect when the app starts. Leave disabled for normal use.
  arp_wake_listener:
    name: ARP wake-up listener
    description: Detect when configured battery cameras wake on the local network and automatically switch their RTSP stream from standby to live video.
  debug_credentials:
    name: Debug credentials
    description: Temporary credential diagnostics for troubleshooting. Leave disabled normally.
network:
  8099/tcp: Local bridge API used by the Home Assistant integration
  8100/tcp: RTSP camera streaming for Frigate, go2rtc, VLC, and ffmpeg
