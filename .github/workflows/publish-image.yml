name: Publish native bridge image

on:
  push:
    branches: [main]
    paths:
      - "okam_native_app/**"
      - "src/okam_native/**"
      - "native/android_compat/**"
      - "native/hybris_probe/**"
      - "native/hybris_connect/**"
      - "native/amd64_connect/**"
      - "tools/fetch_official_sdk.py"
      - "docs/vendor-artifacts.json"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Suffix for a test build, e.g. test1. Empty publishes the plain version."
        required: false
        default: ""
      move_latest:
        description: "Also move the latest tag. Ignored unless run from main."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-okam-native
  cancel-in-progress: false

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python3 -m compileall src okam_native_app custom_components tests
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in [Path("repository.yaml"), Path("okam_native_app/config.yaml"), Path("okam_native_app/test-addon/config.yaml")]:
              value = yaml.safe_load(path.read_text())
              assert isinstance(value, dict), path
          for path in [Path("hacs.json"), Path("custom_components/okam/manifest.json")]:
              value = json.loads(path.read_text())
              assert isinstance(value, dict), path
          PY
      - run: git diff --check

  unit_tests:
    name: Unit tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv

  startup_integration_tests:
    name: Production startup integration tests
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv tests/test_startup_integration.py

  addon_validation:
    name: Add-on schema validation
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv tests/test_ha_app.py

  hacs_validation:
    name: HACS validation
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  container_smoke_build:
    name: Unreleased container smoke (${{ matrix.platform }})
    needs: [startup_integration_tests, addon_validation, hacs_validation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            arch: arm64
            ha_arch: aarch64
          - platform: linux/amd64
            arch: amd64
            ha_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build unreleased smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          target: final
          outputs: type=oci,dest=/tmp/okam-${{ matrix.arch }}.tar
          build-args: |
            BUILD_VERSION=prebuild-${{ github.sha }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.arch }}
      - name: Inspect container contents and startup wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - "/tmp/okam-${{ matrix.arch }}.tar" <<'PY'
          import gzip, io, json, sys, tarfile
          with tarfile.open(sys.argv[1]) as image:
              index = json.load(image.extractfile("index.json"))
              manifest = index["manifests"][0]["digest"].replace(":", "/")
              descriptor = json.loads(image.extractfile(manifest).read())
              names = set()
              texts = []
              for layer in descriptor["layers"]:
                  blob_name = layer["digest"].replace(":", "/")
                  blob = image.extractfile(blob_name).read()
                  with tarfile.open(fileobj=gzip.GzipFile(fileobj=io.BytesIO(blob))) as layer_tar:
                      for member in layer_tar:
                          names.add(member.name)
                          if member.isfile() and member.name in {"opt/okam/app_entrypoint.py", "opt/okam/okam_native/auth.py", "opt/okam/okam_native/account.py"}:
                              texts.append(layer_tar.extractfile(member).read().decode(errors="replace"))
          assert {"opt/okam/app_entrypoint.py", "opt/okam/okam_native/auth.py", "opt/okam/okam_native/account.py"} <= names
          source = "\n".join(texts)
          for marker in ("camera_auth_attempt", "configured_camera_selections", "open_authenticated_stream_process"):
              assert marker in source, marker
          PY

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      move_latest: ${{ steps.app.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app
        shell: bash
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          REQUEST_LATEST: ${{ inputs.move_latest }}
        run: |
          set -eu
          base="$(sed -n 's/^version: //p' okam_native_app/config.yaml)"
          if [ -n "${TAG_SUFFIX:-}" ]; then
            echo "version=${base}-${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}" >> "$GITHUB_OUTPUT"
          fi
          # latest must only ever follow main. A test build published from a
          # branch must not repoint the tag that installations track.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
             && { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${REQUEST_LATEST:-false}" = "true" ]; }; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, container_smoke_build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
            docker_arch: arm64
          - ha_arch: amd64
            platform: linux/amd64
            docker_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.ha_arch }} app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/dunlabx/okam-ha-proxy:${{ needs.prepare.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.docker_arch }}
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOVE_LATEST: ${{ needs.prepare.outputs.move_latest }}
        run: |
          set -eu
          image="ghcr.io/dunlabx/okam-ha-proxy"
          tags=(--tag "$image:$VERSION")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "$image:latest")
          else
            echo "Leaving :latest untouched; publishing $VERSION only."
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$VERSION-aarch64" \
            "$image:$VERSION-amd64"
          docker buildx imagetools inspect "$image:$VERSION"
