name: Publish native bridge image

on:
  push:
    branches: [main]
    paths:
      - "okam_native_app/**"
      - "src/okam_native/**"
      - "native/android_compat/**"
      - "native/hybris_probe/**"
      - "native/hybris_connect/**"
      - "native/amd64_connect/**"
      - "tools/fetch_official_sdk.py"
      - "docs/vendor-artifacts.json"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Suffix for a test build, e.g. test1. Empty publishes the plain version."
        required: false
        default: ""
      move_latest:
        description: "Also move the latest tag. Ignored unless run from main."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-okam-native
  cancel-in-progress: false

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python3 -m compileall src okam_native_app custom_components tests
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in [Path("repository.yaml"), Path("okam_native_app/config.yaml"), Path("okam_native_app/test-addon/config.yaml")]:
              value = yaml.safe_load(path.read_text())
              assert isinstance(value, dict), path
          for path in [Path("hacs.json"), Path("custom_components/okam/manifest.json")]:
              value = json.loads(path.read_text())
              assert isinstance(value, dict), path
          addon = yaml.safe_load(Path("okam_native_app/config.yaml").read_text())
          camera_schema = addon["schema"]["cameras"][0]
          assert camera_schema["auth_method"] == "list(automatic|password)"
          flow = Path("custom_components/okam/config_flow.py").read_text()
          strings = Path("custom_components/okam/strings.json").read_text()
          assert '"camera_id": "UID or alias"' in strings
          assert "CONF_AUTH_METHOD" not in flow and "CONF_CAMERA_PASSWORD" not in flow
          assert '"auth_method"' not in strings and '"camera_password"' not in strings
          PY
      - run: git diff --check

  unit_tests:
    name: Unit tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv

  startup_integration_tests:
    name: Production startup integration tests
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv tests/test_startup_integration.py

  addon_validation:
    name: Add-on schema validation
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: PYTHONPATH=src python -m pytest -vv tests/test_ha_app.py

  hacs_validation:
    name: HACS validation
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  container_smoke_build:
    name: Unreleased container smoke (${{ matrix.platform }})
    needs: [prepare, startup_integration_tests, addon_validation, hacs_validation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            arch: arm64
            docker_arch: arm64
            ha_arch: aarch64
          - platform: linux/amd64
            arch: amd64
            docker_arch: amd64
            ha_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate artifact once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          target: final
          push: true
          tags: ghcr.io/dunlabx/okam-ha-proxy:${{ needs.prepare.outputs.version }}-candidate-${{ github.sha }}-${{ matrix.ha_arch }}
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.docker_arch }}
      - name: Smoke-test the exact pushed artifact
        shell: bash
        env:
          IMAGE: ghcr.io/dunlabx/okam-ha-proxy:${{ needs.prepare.outputs.version }}-candidate-${{ github.sha }}-${{ matrix.ha_arch }}
        run: |
          set -euo pipefail
          docker pull --platform '${{ matrix.platform }}' "$IMAGE"
          cid="$(docker create --platform '${{ matrix.platform }}' "$IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/opt/okam/app_entrypoint.py" /tmp/app_entrypoint.py
          docker cp "$cid:/opt/okam/okam_native/auth.py" /tmp/auth.py
          docker cp "$cid:/opt/okam/okam_native/account.py" /tmp/account.py
          docker cp "$cid:/opt/okam/standby.h264" /tmp/standby.h264
          test -s /tmp/standby.h264
          grep -q 'camera_auth_attempt' /tmp/auth.py
          grep -q 'debug_credentials' /tmp/auth.py
          grep -q 'manual_password' /tmp/auth.py
          grep -q 'configured_camera_selections' /tmp/account.py
          grep -q 'api_device_raw' /tmp/account.py
          grep -q 'auth_method' /tmp/app_entrypoint.py
          grep -q 'open_authenticated_stream_process' /tmp/app_entrypoint.py
          grep -q 'build_fingerprint' /tmp/app_entrypoint.py
          grep -q 'runtime_module' /tmp/app_entrypoint.py
          for pair in \
            'okam_native/auth.py /tmp/auth.py' \
            'okam_native/account.py /tmp/account.py' \
            'okam_native/bridge.py /tmp/bridge.py' \
            'okam_native/session.py /tmp/session.py' \
            'okam_native/rtsp.py /tmp/rtsp.py' \
            'okam_native/p2p.py /tmp/p2p.py'; do
            set -- $pair
            docker cp "$cid:/opt/okam/$1" "/tmp/$(basename "$1")"
            test "$(sha256sum "src/$1" | cut -d' ' -f1)" = "$(sha256sum "/tmp/$(basename "$1")" | cut -d' ' -f1)"
          done
          docker run --rm --platform '${{ matrix.platform }}' --entrypoint python3 "$IMAGE" -c \
            'import os,sys,os.path,okam_native,okam_native.auth,okam_native.bridge,okam_native.session,okam_native.rtsp,okam_native.p2p; print("sys.path",sys.path); print("PYTHONPATH",os.environ.get("PYTHONPATH")); print("cwd",os.getcwd()); print("modules",okam_native.__file__,okam_native.auth.__file__,okam_native.bridge.__file__,okam_native.session.__file__,okam_native.rtsp.__file__,okam_native.p2p.__file__); print("fingerprint",os.environ.get("OKAM_BUILD_VERSION"),os.environ.get("OKAM_BUILD_COMMIT"))'

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      move_latest: ${{ steps.app.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app
        shell: bash
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          REQUEST_LATEST: ${{ inputs.move_latest }}
        run: |
          set -eu
          base="$(sed -n 's/^version: //p' okam_native_app/config.yaml)"
          if [ -n "${TAG_SUFFIX:-}" ]; then
            echo "version=${base}-${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}" >> "$GITHUB_OUTPUT"
          fi
          # latest must only ever follow main. A test build published from a
          # branch must not repoint the tag that installations track.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
             && { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${REQUEST_LATEST:-false}" = "true" ]; }; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [prepare, container_smoke_build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOVE_LATEST: ${{ needs.prepare.outputs.move_latest }}
        run: |
          set -eu
          image="ghcr.io/dunlabx/okam-ha-proxy"
          tags=(--tag "$image:$VERSION")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "$image:latest")
          else
            echo "Leaving :latest untouched; publishing $VERSION only."
          fi
          # Promote the exact architecture artifacts built and smoke-tested
          # above; this job performs no Docker compilation.
          docker buildx imagetools create --tag "$image:$VERSION-aarch64" \
            "$image:$VERSION-candidate-${GITHUB_SHA}-aarch64"
          docker buildx imagetools create --tag "$image:$VERSION-amd64" \
            "$image:$VERSION-candidate-${GITHUB_SHA}-amd64"
          docker buildx imagetools create "${tags[@]}" \
            "$image:$VERSION-aarch64" \
            "$image:$VERSION-amd64"
          docker buildx imagetools inspect "$image:$VERSION"
